# News sources. Every source here was tested and working on 2026-10-24.
#
# Two kinds of source:
#   url:          a normal RSS/Atom feed
#   google_news:  a Google News search, for publishers whose feed blocks automated readers.
#                 "site:example.com" returns that publisher's recent headlines.
#
# To ADD a source: copy a block, change the name and url (or google_news), save.
# To REMOVE a source: delete its block, or add `enabled: false` to pause it.
# `category` is optional, a hint used only when a story's keywords are ambiguous.
#   Valid categories: wearables, nutrition, longevity, retail, ai, funding, policy
#
# Broad feeds are fine: every story is relevance-filtered and off-topic ones are dropped.
# Check that every source works:   python scripts/check_sources.py

sources:
  # ---------- Digital health / industry ----------
  - name: Fierce Healthcare
    url: https://www.fiercehealthcare.com/rss/xml
  - name: Healthcare Dive
    url: https://www.healthcaredive.com/feeds/news/
  - name: STAT (Health Tech)
    url: https://www.statnews.com/category/health-tech/feed/
  - name: TechCrunch (Biotech & Health)
    url: https://techcrunch.com/category/biotech-health/feed/
  - name: Digital Health Wire
    url: https://www.digitalhealthwire.com/feed/
  - name: Healthcare Brew
