# The 7 categories and the keywords used to sort stories into them.
# A story goes into the category whose keywords it matches most (headline matches count double).
# Add keywords to improve sorting; matching ignores capitalization.
# A story that matches NO category and NO watchlist company is treated as off-topic and dropped.

wearables:
  label: "Wearables & Biometrics"
  short: "Wearables"
  keywords: [wearable, wearables, smartwatch, smart watch, smart ring, fitness tracker, Apple Watch,
    Galaxy Watch, Galaxy Ring, Pixel Watch, Fitbit, Garmin, Oura, Whoop, Ultrahuman, Polar, Coros,
    CGM, continuous glucose, Dexcom, Stelo, Libre, Lingo, heart rate, HRV, blood pressure monitor,
    biometric, biometrics, sleep tracking, hearing aid, AirPods, HealthKit, Apple Health, Samsung Health,
    sensor, ECG, blood oxygen, smart scale]

